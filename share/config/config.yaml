cache:
  # Cache for final rendered responses (HTML, JSON, PNG, text, etc.)
  responses:
    type: lru
    size: 50000          # your previous LRU size
    ttl: 10m             # short TTL for rendered output
    enabled: true

  # Cache for raw weather data from upstream APIs (WWO, etc.)
  weather:
    type: disk
    dir: /var/cache/wttr.in/weather
    ttl: 45m
    max_size_mb: 2048     # 2 GB soft limit
    cleanup_interval: 15m
    enabled: true

ip:
    ipCache: cache/ip2l
    ipCacheDb: /wttr.in/cache/geoip.db
    ipCacheType: db
    # btGeoip: China-accurate IPv4 database (bt.cn-ip format). Consulted first.
    # Get it from https://www.bt.cn/ (or any bt.cn-ip mirror) and point this at it.
    btGeoip: /wttr.in/data/bt_monitor.mmdb
    # geoip2: global fallback, also covers IPv6 (MaxMind GeoLite2-City).
    geoip2: /wttr.in/wttr.in-v2-v2/data/GeoLite2-City-20260310.mmdb

geo:
    locationCache: cache/loc
    locationCacheDb: cache/geoloc.db
    locationCacheType: db
    # Geocoders are tried in order; the first hit wins.
    # "osm" needs no API key and honours lang, which is what makes
    # Chinese place names ("北京", "朝阳区") resolve correctly.
    nominatim:
        - name: osm
          type: osm
          url: https://nominatim.openstreetmap.org/search
          lang: zh
        - name: opencage
          type: opencage
          url: https://api.opencagedata.com/geocode/v1/json
          token: "TOKEN"

weather:
  wwo:
    baseUrl: "http://wttr.in/{lat},{lon}?format=j1&lang={lang}"
    # token: "TOKEN"

logging:
    accessLog: log/access.log
    errorsLog: log/errors.log
    interval: 300

server:
    portHttp: 8080
    portHttps: 8443
    tlsCertFile: /wttr.in/etc/fullchain.pem
    tlsKeyFile: /wttr.in/etc/privkey.pem
