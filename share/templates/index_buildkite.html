<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wttr.in — {{ .Title }}</title>
    <link rel="stylesheet" type="text/css"
          href="https://adobe-fonts.github.io/source-code-pro/source-code-pro.css">
    <style>
        /* ── Terminal grid normalization ─────────────────────────────────
           The report is laid out in fixed character cells, so every glyph
           must occupy exactly 1 cell (2 for CJK). A single font cannot do
           that: DejaVu Sans Mono covers ASCII but has no braille glyphs
           (the v2 plots), and CJK fallbacks are proportional.

           Splitting the ranges and rescaling each to the ASCII advance makes
           ASCII : braille : CJK = 1 : 1 : 2, which keeps every box aligned
           regardless of which family the browser actually resolves. */
        @font-face {
            font-family: "WTTR Mono";
            src: local("DejaVu Sans Mono"), local("Liberation Mono");
            unicode-range: U+0000-27FF, U+2900-FFFF;
        }
        @font-face {
            font-family: "WTTR Mono";
            /* Braille comes from a proportional fallback: shrink to 1 cell. */
            src: local("DejaVu Sans");
            unicode-range: U+2800-28FF;
            size-adjust: 82.2%;
        }
        @font-face {
            font-family: "WTTR Mono";
            /* CJK: force exactly two ASCII cells. */
            src: local("WenQuanYi Zen Hei"), local("Noto Sans CJK SC"),
                 local("Microsoft YaHei"), local("PingFang SC");
            unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FF60, U+FFE0-FFE6;
            size-adjust: 118%;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #000000;
            height: 100%;
            overflow: auto;
        }
        .term-container {
            background: #000000;
            color: #bbbbbb;
            font-family: "WTTR Mono",
                         "Source Code Pro",
                         "DejaVu Sans Mono",
                         Menlo,
                         "Lucida Console",
                         monaco,
                         monospace;
            font-size: 11.8px;
            line-height: 1.30 !important;
            letter-spacing: 0.00em;
            padding: 6px 10px 0px 10px;
            white-space: pre;
            word-break: normal;
            overflow-wrap: normal;
            margin: 0;
            max-width: 100%;
            width: fit-content;
            display: block;
            box-sizing: border-box;
        }
        .term-fg1, .bold {
            color: #eeeeee;
            font-weight: normal;
        }
        /* Buildkite terminal-to-html color classes */
        {{.CSS}}

        /* Buttons container - prevents splitting on narrow screens */
        .social-buttons {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px;
            align-items: center;
            margin-top: 0px;
            padding: 0 10px;
            overflow-x: auto;           /* scroll horizontally if too narrow */
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;      /* nicer scrollbar on Firefox */
        }

        .social-buttons::-webkit-scrollbar {
            height: 6px;
        }

        .github-button {
            white-space: nowrap;
            flex-shrink: 0;             /* prevent individual buttons from shrinking */
        }
    </style>
</head>
<body>
    <div class="term-container">
        {{- .Body}}
    </div>
    {{- if not .Query.Options.NoFollowLine }}
    <div class="social-buttons">
        <a aria-label="Star linbeize/wttr.in on GitHub"
           data-count-aria-label="# stargazers on GitHub"
           data-count-api="/repos/linbeize/wttr.in#stargazers_count"
           data-count-href="/linbeize/wttr.in/stargazers"
           data-show-count="true"
           data-icon="octicon-star"
           href="https://github.com/linbeize/wttr.in"
           class="github-button">wttr.in</a>

        <a href="https://github.com/schachmat/wego"
           class="github-button" aria-label="wego">wego</a>

        <a href="https://github.com/chubin/pyphoon"
           class="github-button" aria-label="pyphoon">pyphoon</a>
    </div>

    <script async defer id="github-bjs" src="https://buttons.github.io/buttons.js"></script>
    {{ end }}
</body>
</html>
